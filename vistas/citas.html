<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Salud Digital - Agendar Cita</title>
  <link rel="stylesheet" href="../css/citas.css">
</head>
<body>

  <div class="navbar">
    <div class="user-info">
      Usuario: <strong id="userDisplayName">-</strong> (<span id="userRoleBadge">-</span>)
    </div>
    <div class="nav-buttons">
      <a href="ver_citas.html" id="adminPanelLink" class="btn-admin-link" style="display: none;">Ver Panel Admin</a>
      <button onclick="logout()" class="btn-logout">Cerrar Sesión</button>
    </div>
  </div>

  <div class="card">
    <div class="header">
      <h2>Salud Digital</h2>
      <p>Agendamiento de Citas Médicas</p>
    </div>

    <form id="citaForm">
      <div class="form-row">
        <div class="form-group">
          <label for="paciente">Nombre del Paciente</label>
          <input type="text" id="paciente" placeholder="Ej. Juan Pérez" required>
        </div>
        <div class="form-group">
          <label for="documento">DNI / Documento</label>
          <input type="text" id="documento" placeholder="70604054" required>
        </div>
      </div>

      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" placeholder="correo@ejemplo.com" required>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="especialidad">Especialidad</label>
          <select id="especialidad" required onchange="actualizarMedicos()">
            <option value="">-- Seleccionar --</option>
            <option value="Cardiología">Cardiología</option>
            <option value="Pediatría">Pediatría</option>
            <option value="Medicina General">Medicina General</option>
          </select>
        </div>
        <div class="form-group">
          <label for="doctor">Médico</label>
          <select id="doctor" required disabled>
            <option value="">-- Seleccione Especialidad --</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="fechaHora">Fecha y Hora de la Cita</label>
        <input type="datetime-local" id="fechaHora" required>
      </div>

      <div class="form-group">
        <label for="motivo">Motivo de Consulta</label>
        <textarea id="motivo" placeholder="Describa el motivo de su cita..." required></textarea>
      </div>

      <button type="submit" class="btn-agendar">Confirmar y Agendar Cita</button>
    </form>

    <div id="mensaje" class="msg"></div>
  </div>

  <script src="../js/citas.js"></script>

</body>
</html>
