<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TeleSalud Express - Panel de Citas</title>
  <link rel="stylesheet" href="../css/ver_citas.css">
</head>
<body>

  <div class="navbar">
    <div class="user-info">
      Sesión Administración: <strong id="userDisplayName">Administrador Sistema</strong>
    </div>
    <div class="nav-actions">
      <a href="citas.html" class="btn-agendar-nav">+ Agendar Cita</a>
      <button onclick="logout()" class="btn-logout">Cerrar Sesión</button>
    </div>
  </div>

  <div class="container">
    <div class="header">
      <h2>TeleSalud Express</h2>
      <p>Panel de Control y Verificación de Citas (Módulo Administrador)</p>
    </div>

    <div class="table-responsive">
      <table id="tablaCitas">
        <thead>
          <tr>
            <th>Paciente / DNI</th>
            <th>Correo</th>
            <th>Especialidad</th>
            <th>Médico</th>
            <th>Fecha y Hora</th>
            <th>Motivo</th>
          </tr>
        </thead>
        <tbody>
          
        </tbody>
      </table>
      <div id="emptyState" class="empty-state" style="display: none;">No hay citas registradas en el sistema.</div>
    </div>

    <div class="actions">
      <button onclick="limpiarCitas()" class="btn-clear">Vaciar Citas</button>
    </div>
  </div>

  <script src="../js/ver_citas.js"></script>

</body>
</html>
