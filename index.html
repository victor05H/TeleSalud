<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Salud Digital - Iniciar Sesión</title>
  <link rel="stylesheet" href="css/login.css">
</head>
<body>

  <div class="logo-container">
    <div class="logo-title">Salud</div>
    <div class="logo-subtitle">Digital</div>
  </div>

  <div class="card">
    <h2>Bienvenido(a)</h2>

    <form id="loginForm">
      <div class="form-group">
        <div class="input-wrapper">
          <span>👤</span>
          <div class="input-content">
            <label>Número de Documento / Usuario</label>
            <input type="text" id="username" placeholder="admin / usuario" required>
          </div>
        </div>
      </div>

      <div class="form-group">
        <div class="input-wrapper">
          <span>🔒</span>
          <div class="input-content">
            <label>Contraseña</label>
            <input type="password" id="password" placeholder="••••••••" required>
          </div>
        </div>
      </div>

      <button type="submit" class="btn-ingresar">Ingresar</button>
    </form>

    <div id="errorMsg" class="error-msg">Usuario o contraseña incorrectos.</div>

    <div class="demo-credentials">
      <strong>Acceso Demo:</strong><br>
      Admin: <code>admin</code> / <code>123</code><br>
      Usuario: <code>usuario</code> / <code>123</code>
    </div>
  </div>

  <div class="info-box">Atención al cliente y consultas de citas online.</div>

  <script src="js/login.js"></script>

</body>
</html>
